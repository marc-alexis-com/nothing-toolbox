[package]
name = "nothing-toolbox"
version = "0.1.0"
edition = "2021"
description = "Linux client for the Nothing Headphone (1) (B170): ANC, status, notifications, head tracking, logs"
license = "MIT"
readme = "README.md"
keywords = ["bluetooth", "rfcomm", "headphones", "nothing", "linux"]
categories = ["command-line-utilities", "hardware-support"]
publish = false

[[bin]]
name = "nothing"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
