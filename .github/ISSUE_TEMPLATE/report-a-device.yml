name: Report a device
description: Report a Nothing device so it can be supported
title: "[device] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping `nothing` grow beyond the one headset it was built on.
        Everything asked here is read-only. Remove the serial number and any Bluetooth address.
  - type: input
    id: product
    attributes:
      label: Product
      description: The name, and the model id if you know it.
      placeholder: Nothing Ear (2), B155
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: nothing info
      description: Paste the output (model id and firmware).
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: nothing status
      description: Paste the output. Remove the serial and addresses.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: What works, what doesn't
      description: What the tool got right or wrong on your device.
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you post
      options:
        - label: I removed the serial number and any Bluetooth address.
          required: true
